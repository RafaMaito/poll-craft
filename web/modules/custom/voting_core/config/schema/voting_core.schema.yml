# Config schema for Voting Core.
voting_core.settings:
  type: config_object
  label: 'Voting Core settings'
  mapping:
    voting_enabled:
      type: boolean
      label: 'Enable voting system'
    show_results_by_default:
      type: boolean
      label: 'Show results by default'
    allow_anonymous_voting:
      type: boolean
      label: 'Allow anonymous voting'
    max_votes_per_question:
      type: integer
      label: 'Max votes per question'
    max_votes_per_hour:
      type: integer
      label: 'Max votes per user per hour'
    cache_results_ttl:
      type: integer
      label: 'Results cache TTL (seconds)'
    global_voting_enabled:
      type: boolean
      label: 'Global voting enabled (legacy)'
    default_show_results:
      type: boolean
      label: 'Default show results (legacy)'
    api_rate_limit_per_ip:
      type: integer
      label: 'API rate limit per IP'
    api_rate_limit_window:
      type: integer
      label: 'API rate limit window (seconds)'
    external_sync_enabled:
      type: boolean
      label: 'External sync enabled'
    external_api_url:
      type: string
      label: 'External API URL'
    external_api_key:
      type: string
      label: 'External API key'
    external_sync_queue_name:
      type: string
      label: 'External sync queue name'
